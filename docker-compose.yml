services:
  pixhook-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pixhook/api:local
    container_name: pixhook-api
    ports:
      - "5180:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Signing__Secrets__mercadopago: ${PIXHOOK_MP_SECRET:-mp-webhook-secret-dev}
    volumes:
      - pixhook-data:/data
    # Para disparar webhooks para uma API rodando no seu host use
    # http://host.docker.internal:<porta>/... como destinationUrl.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pixhook-data:
